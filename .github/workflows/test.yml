name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          # One macOS run: it is the development platform, and it catches
          # BLAS/LAPACK differences that would otherwise only show up locally.
          - os: macos-latest
            python-version: "3.12"
          # Windows is where the platform's default encoding is not UTF-8, so
          # a text read that leaves it unsaid decodes the theory pages as
          # cp1252 and fails. 152 tests did, unseen, until this leg existed.
          - os: windows-latest
            python-version: "3.12"

    name: ${{ matrix.os }} / py${{ matrix.python-version }}

    # Every step is written for bash (heredocs, tee, grep); Windows would
    # otherwise run them in PowerShell. Git Bash is on the hosted image.
    defaults:
      run:
        shell: bash

    # pytest's own output on a Windows pipe is cp1252 without this. Only
    # stdout: PYTHONUTF8 would change open()'s default too, and hide exactly
    # the bug the Windows leg is here to catch.
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Qt's *offscreen* platform plugin needs no X server, so no Xvfb and none
      # of the libxcb-* family -- but libQt6Gui still links EGL, and fontconfig
      # and GLib have to be present for the plugin to load at all.
      #
      # libglib2.0-0 was renamed libglib2.0-0t64 in Ubuntu 24.04; the old name
      # fails this step. If the plugin still refuses to load, QT_DEBUG_PLUGINS=1
      # names the missing .so directly.
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libglib2.0-0t64 libdbus-1-3 libfontconfig1 \
            libfreetype6 libxkbcommon0

      # Every extra by name, not a subset that happens to pull the rest in.
      # `metrology` needs only matplotlib, which `dev` already carries -- so
      # omitting it here still produced a green run while never once resolving
      # the extra the package declares. That is the kind of break that surfaces
      # first for a user rather than for CI.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui,metrology,refractiveindex]"

      # A floor in `dev` that this job has already outgrown is how the pytest
      # 9.2 change got in: `pytest>=7` was satisfied by the 9.1.1 a developer
      # had installed, while CI resolved 9.2 and rejected a `pytest.approx`
      # over a list of tuples that the older copy accepted -- green locally,
      # red on all four legs. The install step always takes the newest, so
      # compare what it got against what pyproject.toml asks for and say when
      # the floor has gone stale. A warning, not a failure: a new release of
      # either tool should not break the build on the day it lands.
      - name: Warn when a tooling floor has gone stale
        run: |
          python - <<'EOF'
          import re
          import tomllib
          from importlib.metadata import version

          with open("pyproject.toml", "rb") as handle:
              dev = tomllib.load(handle)["project"]["optional-dependencies"]["dev"]
          floors = dict(
              re.match(r"([A-Za-z0-9_.-]+)>=([0-9.]+)", req).groups()
              for req in dev
              if ">=" in req
          )
          # Only the two that gate the suite. The library floors are genuine
          # minimums and are meant to sit below what CI resolves.
          for name in ("pytest", "ruff"):
              floor, got = floors[name], version(name)
              want = tuple(int(part) for part in floor.split("."))
              have = tuple(int(part) for part in got.split(".")[: len(want)])
              if have > want:
                  print(
                      f"::warning::{name} floor is >={floor} but CI resolved {got}; "
                      f"raise it in pyproject.toml and upgrade local environments"
                  )
              else:
                  print(f"{name} {got} matches its >={floor} floor")
          EOF

      - name: Lint with ruff
        run: ruff check .

      # The Qt tests guard themselves with importorskip, which would hide a
      # broken toolkit install as a quietly shrinking suite. This makes it loud,
      # and it fails here -- next to the apt step that would be at fault --
      # rather than as a mystery in the test job.
      #
      # Constructing a QApplication, not merely importing: the import succeeds
      # long before the platform plugin is asked to load, which is where a
      # missing system library actually bites.
      - name: Confirm the GUI toolkit installed
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -W error -c "
          import matplotlib, PySide6
          from PySide6.QtWidgets import QApplication
          QApplication([])
          print('PySide6', PySide6.__version__, '| matplotlib', matplotlib.__version__)
          "

      # Metrology imports through its own guard rather than through whatever
      # `dev` happens to install, for the same reason the Qt check above exists:
      # an extra that silently resolves via another extra is a latent break, and
      # this fails next to the install step that would be at fault.
      - name: Confirm the metrology extra installed
        run: |
          python -W error -c "
          from gratinglab.metrology import require_matplotlib
          require_matplotlib()
          from gratinglab.metrology.boundary import build_boundary_profile
          print('metrology ok')
          "

      # The refractiveindex.info tests skip without PyYAML, so a broken extra
      # would read as a smaller suite rather than a failure. Read a real file
      # here instead, next to the install step that would be at fault.
      - name: Confirm the refractiveindex extra installed
        run: |
          python -W error -c "
          from gratinglab import materials
          t = materials.from_refractiveindex_file('tests/data/refractiveindex/formula-1_SiO2-Malitson.yml')
          print('refractiveindex ok', t)
          "

      # CI has neither the PCGrate reference corpus nor the AFM scans, so this
      # run also exercises the skip path that every contributor without the
      # research data will hit. If those tests ever error instead of skipping,
      # that is a real bug.
      - name: Run tests
        env:
          # Any text open() that leaves the encoding to the platform now fails
          # on every OS, not only on Windows with a non-ASCII file. The
          # third-party exceptions are scoped in pyproject.toml.
          PYTHONWARNDEFAULTENCODING: "1"
        run: python -m pytest -v --durations=10

      - name: Confirm reference-data tests skipped rather than failed
        env:
          # Any text open() that leaves the encoding to the platform now fails
          # on every OS, not only on Windows with a non-ASCII file. The
          # third-party exceptions are scoped in pyproject.toml.
          PYTHONWARNDEFAULTENCODING: "1"
        run: |
          python -m pytest -q -rs 2>&1 | tee result.txt
          for marker in "reference corpus" "GRATINGLAB_AFM_DIR"; do
            if grep -qi "$marker" result.txt; then
              echo "$marker tests skipped cleanly, as expected on CI"
            else
              echo "::warning::expected $marker tests to report as skipped"
            fi
          done
          # The synthetic scan is committed precisely so metrology is *not*
          # reduced to skips here. If it ever stops carrying the suite, the run
          # would go quietly green while testing almost nothing.
          python - <<'EOF'
          import re, sys
          text = open("result.txt", encoding="utf-8").read()
          m = re.search(r"(\d+) passed", text)
          passed = int(m.group(1)) if m else 0
          print(f"{passed} passed")
          # Raised from 1000, which had drifted to a quarter below the real
          # count and would have let a quarter of the suite vanish unnoticed.
          #
          # 1275, not the local count. CI has neither the PCGrate corpus nor
          # the AFM scans, so the tests behind them skip here -- a data-free
          # run yields 1283 (as of M20, which brought the finite-conductivity
          # suite). A floor set from a local run would fail every CI job
          # while looking like a tightened check.
          if passed < 1275:
              sys.exit(f"only {passed} tests passed; expected >=1275 on CI")
          EOF

      - name: Check the public API imports
        run: |
          python -c "
          import gratinglab
          from gratinglab import Illumination, EfficiencyScan, Provenance
          from gratinglab.problem import Problem
          from gratinglab.profiles import Blazed
          from gratinglab.solvers import scalar, available_solvers
          print('version', gratinglab.__version__)
          print('solvers', available_solvers())
          scan = scalar.solve(
              Problem(period=160.0, profile=Blazed(blaze_angle=30.0)),
              Illumination.offplane(graze=1.5, azimuth=25.0),
              [2.4],
          )
          print('orders', scan.orders.min(), '..', scan.orders.max())
          "
