name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          # One macOS run: it is the development platform, and it catches
          # BLAS/LAPACK differences that would otherwise only show up locally.
          - os: macos-latest
            python-version: "3.12"

    name: ${{ matrix.os }} / py${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Qt's *offscreen* platform plugin needs no X server, so no Xvfb and none
      # of the libxcb-* family -- but libQt6Gui still links EGL, and fontconfig
      # and GLib have to be present for the plugin to load at all.
      #
      # libglib2.0-0 was renamed libglib2.0-0t64 in Ubuntu 24.04; the old name
      # fails this step. If the plugin still refuses to load, QT_DEBUG_PLUGINS=1
      # names the missing .so directly.
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libglib2.0-0t64 libdbus-1-3 libfontconfig1 \
            libfreetype6 libxkbcommon0

      # endstation is not published yet, so `endstation>=0.1` cannot resolve
      # from the dependency line alone. Installing it from git first satisfies
      # the requirement; pip then leaves it alone.
      #
      # Delete this step once endstation is on PyPI -- the dependency line in
      # pyproject.toml is already correct and needs no change then.
      - name: Install endstation from git
        run: python -m pip install "endstation[qt] @ git+https://github.com/jamccoy/endstation.git"

      # Every extra by name, not a subset that happens to pull the rest in.
      # `metrology` needs only matplotlib, which `dev` already carries -- so
      # omitting it here still produced a green run while never once resolving
      # the extra the package declares. That is the kind of break that surfaces
      # first for a user rather than for CI.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui,metrology]"

      - name: Lint with ruff
        run: ruff check .

      # The Qt tests guard themselves with importorskip, which would hide a
      # broken toolkit install as a quietly shrinking suite. This makes it loud,
      # and it fails here -- next to the apt step that would be at fault --
      # rather than as a mystery in the test job.
      #
      # Constructing a QApplication, not merely importing: the import succeeds
      # long before the platform plugin is asked to load, which is where a
      # missing system library actually bites.
      - name: Confirm the GUI toolkit installed
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -W error -c "
          import matplotlib, PySide6
          from PySide6.QtWidgets import QApplication
          QApplication([])
          print('PySide6', PySide6.__version__, '| matplotlib', matplotlib.__version__)
          "

      # Metrology imports through its own guard rather than through whatever
      # `dev` happens to install, for the same reason the Qt check above exists:
      # an extra that silently resolves via another extra is a latent break, and
      # this fails next to the install step that would be at fault.
      - name: Confirm the metrology extra installed
        run: |
          python -W error -c "
          from gratinglab.metrology import require_matplotlib
          require_matplotlib()
          from gratinglab.metrology.boundary import build_boundary_profile
          print('metrology ok')
          "

      # CI has neither the PCGrate reference corpus nor the AFM scans, so this
      # run also exercises the skip path that every contributor without the
      # research data will hit. If those tests ever error instead of skipping,
      # that is a real bug.
      - name: Run tests
        run: python -m pytest -v --durations=10

      - name: Confirm reference-data tests skipped rather than failed
        run: |
          python -m pytest -q -rs 2>&1 | tee result.txt
          for marker in "reference corpus" "GRATINGLAB_AFM_DIR"; do
            if grep -qi "$marker" result.txt; then
              echo "$marker tests skipped cleanly, as expected on CI"
            else
              echo "::warning::expected $marker tests to report as skipped"
            fi
          done
          # The synthetic scan is committed precisely so metrology is *not*
          # reduced to skips here. If it ever stops carrying the suite, the run
          # would go quietly green while testing almost nothing.
          python - <<'EOF'
          import re, sys
          text = open("result.txt").read()
          m = re.search(r"(\d+) passed", text)
          passed = int(m.group(1)) if m else 0
          print(f"{passed} passed")
          # Raised from 1000, which had drifted to a quarter below the real
          # count and would have let a quarter of the suite vanish unnoticed.
          #
          # 1185, not 1244. CI has neither the PCGrate corpus nor the AFM
          # scans, so ~50 tests that pass locally skip here -- a data-free run
          # yields 1193. A floor set from a local run would fail every CI job
          # while looking like a tightened check.
          if passed < 1185:
              sys.exit(f"only {passed} tests passed; expected >=1185 on CI")
          EOF

      - name: Check the public API imports
        run: |
          python -c "
          import gratinglab
          from gratinglab import Illumination, EfficiencyScan, Provenance
          from gratinglab.problem import Problem
          from gratinglab.profiles import Blazed
          from gratinglab.solvers import scalar, available_solvers
          print('version', gratinglab.__version__)
          print('solvers', available_solvers())
          scan = scalar.solve(
              Problem(period=160.0, profile=Blazed(blaze_angle=30.0)),
              Illumination.offplane(graze=1.5, azimuth=25.0),
              [2.4],
          )
          print('orders', scan.orders.min(), '..', scan.orders.max())
          "
