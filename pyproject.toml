[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gratinglab"
version = "0.0.1"
description = "Open platform for diffraction grating groove metrology and efficiency analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Jake McCoy" }]
keywords = ["diffraction", "grating", "efficiency", "rcwa", "x-ray", "spectroscopy",
            "afm", "metrology", "blaze", "pcgrate"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-qt>=4.5", "matplotlib>=3.8", "pandas>=2.1", "ruff>=0.16"]
# The GUI is an optional extra: `pip install gratinglab` must never require
# a toolkit.
#
# PySide6-Essentials rather than the PySide6 meta-package: the Addons
# (WebEngine, Multimedia, 3D) are hundreds of megabytes this window never
# touches. Essentials still carries QtSvg, which matplotlib's Qt shim imports
# unconditionally.
#
# PySide6 (LGPLv3) rather than PyQt6 (GPL): this package is BSD-3, and an
# optional dynamically-linked dependency keeps it that way.
gui = ["matplotlib>=3.8", "PySide6-Essentials>=6.7"]
# Groove metrology: reading AFM scans and averaging them into a boundary
# profile. An extra for the same reason the GUI is one -- `pip install
# gratinglab` must stay numpy/scipy/pydantic, so a solver-only user never
# installs a plotting stack. The delta is small in practice: matplotlib is
# already in `gui`, so anyone running the window has it either way.
metrology = ["matplotlib>=3.9"]
# Mutation testing, run on demand rather than in CI -- a full sweep is orders
# of magnitude slower than the suite. Deliberately *not* in `dev`: nothing in
# CI needs it, and pinning below mutmut 3.3 keeps it installable without a Rust
# toolchain. mutmut >= 3.3 requires libcst, which ships no macOS x86_64 wheel
# and must then be compiled; 3.2.3 uses parso and is pure Python. mutmut's own
# README names this case ("known for at least the x86_64-darwin architecture").
mut = ["mutmut>=3.2,<3.3"]

[project.scripts]
gratinglab-gui = "gratinglab.gui.app:main"
gratinglab-metrology-gui = "gratinglab.metrology.gui:main"
# The metrology CLI, carried over unchanged. It still takes no arguments and
# dispatches on `config.ANALYSIS_MODE`; reconciling that with the rest of the
# project is real work and deliberately not part of this merge.
gratinglab-metrology = "gratinglab.metrology.cli:main"

[project.urls]
Homepage = "https://github.com/jamccoy/gratinglab"

# Solver backends register here. A backend may live in its own distribution.
[project.entry-points."gratinglab.solvers"]

[tool.setuptools.packages.find]
where = ["src"]

# Vendored optical constants ship with the wheel. Without this they exist in a
# checkout and vanish on install, so `materials.lookup("Au")` would work for
# every developer and fail for every user -- the worst version of the bug.
# `docs/theory/` is deliberately *not* handled this way: it is genuinely
# dev-checkout-only and `gui/docs.py` degrades to an explanatory entry when it
# is absent. Optical constants cannot degrade like that; a missing table has to
# raise.
[tool.setuptools.package-data]
"gratinglab.materials" = ["data/*.txt", "data/SOURCES.md"]
# The metrology wiki ships too, for the same reason: pages that exist in a
# checkout and vanish on install are worse than no pages. This is also the
# model `docs/theory/` should adopt -- see docs/roadmap.md.
"gratinglab.metrology.wiki" = ["*.md"]

# Linting arrived with the metrology package and was briefly lost with it: the
# configuration lived in that project's pyproject.toml, which the merge
# discarded along with its packaging. Restored here, and now covering the whole
# project rather than the half that used to have it.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Ruff's own zero-config default before 0.x expanded it. Pyflakes (F) and the
# handful of pycodestyle error codes that are real bugs rather than style
# opinions -- undefined names, syntax errors, bare except -- not the ~900-rule
# everything selection ruff now applies with no config at all.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Relative to rootdir, so a run driven from a copied tree imports *that*
# tree's package. Without it, mutation testing silently imports the real
# source and reports every mutant as surviving -- a useless green run rather
# than a loud failure. A no-op for a plain `pytest` here, where it is the same
# path the editable install already provides.
pythonpath = ["src"]
filterwarnings = ["error"]
# pytest-qt would otherwise probe every binding it knows. Verified clean under
# `python -W error -c "import PySide6.QtWidgets"`, so `filterwarnings = error`
# above needs no exemption; if a future PySide6 starts warning at import, add a
# narrow ignore naming the exact message -- never a bare DeprecationWarning.
qt_api = "pyside6"

[tool.mutmut]
# The whole package, so the copy under `mutants/` is a working package -- this
# list controls what is *copied* as well as what is mutated, and omitting
# __init__.py leaves an incomplete tree that silently falls through to the real
# source, at which case every mutant "survives" and the run means nothing.
paths_to_mutate = ["src/gratinglab/"]

# Excluded rather than uncopied, so the package stays importable.
#
# `gui/` computes nothing: a surviving mutant in a widget means a misplaced
# button, not a wrong number, which is the whole reason that layer was arranged
# to be thin. `io/` is pinned by round-trip and corpus-parsing tests rather than
# by anything a mutation operator reaches usefully.
do_not_mutate = [
    "*/gui/*",
    "*/io/*",
    # Metrology arrived with its own suite and has never been mutated. Left
    # out for now so the merge is not also a coverage change; revisit once
    # the seam in `boundary/` is settled.
    "*/metrology/*",
    "*/__init__.py",
    # Pydantic models. mutmut's trampoline adds an un-annotated class
    # attribute holding the mutant table, and `BaseModel.__init_subclass__`
    # rejects any un-annotated attribute outright -- the module fails to
    # import, so nothing can be tested rather than something being tested
    # wrongly. A tool limitation, not a coverage judgement -- their validators
    # are covered by tests/test_illumination.py and tests/test_profiles.py.
    "*/illumination.py",
    "*/problem.py",
    "*/profiles.py",
]

# corpus.toml, which the reference tests read.
also_copy = ["benchmarks/"]
