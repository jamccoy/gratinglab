[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gratinglab"
# Read from `gratinglab.__version__`, the way endstation does, so a release
# bumps one literal. Everything else (provenance, the GUI's About box, the
# release workflow's tag check) already reads `__version__`, and
# tests/test_result.py holds CITATION.cff to it.
dynamic = ["version"]
description = "Open platform for diffraction grating groove metrology and efficiency analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Jake McCoy" }, { name = "Aditi Gangadharan" }]
# Wavelength-neutral on purpose. The off-plane work this package grew out of is
# soft x-ray, and that band is still named, but nothing in the solvers or the
# metrology assumes one: the grating equation carries no band, and the
# materials layer reads CXRO x-ray tables and refractiveindex.info
# ultraviolet-to-infrared tables alike. Leading with "x-ray" told a reader the
# in-plane half of the package was not meant for them.
#
# "pcgrate" is deliberately absent. It is a program this project validates
# against, not a feature of this one, and a search for it should not land here.
keywords = ["diffraction", "grating", "diffraction grating", "diffraction efficiency",
            "optics", "rcwa", "integral method", "spectroscopy", "afm", "metrology",
            "blaze", "groove profile", "ultraviolet", "infrared", "x-ray"]
# Only classifiers from the trove list, which PyPI rejects uploads over. Note
# that there is no `Topic :: Scientific/Engineering :: Optics`; Physics is the
# nearest, with Information Analysis for the metrology and Visualization for
# the windows. No Qt environment classifier: a classifier cannot be made
# conditional on an extra, and a default install pulls no toolkit at all.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    # Shared scaffolding: the optional-dependency guards, the toolkit-boundary
    # check, the layout floors and the macOS bundle builders. Its core declares
    # `dependencies = []` and has a test that fails if that stops being true,
    # so this line adds no transitive weight -- the Qt and matplotlib parts sit
    # behind its own extras, which our `gui` extra asks for by name.
    "endstation>=0.2.2",
    # The rigorous solvers cap BLAS threads for the length of a solve
    # (solvers/_execution.py): OpenBLAS's thread-per-core default made RCWA
    # up to 135x slower on a busy machine, measured in benchmarks/
    # solver_speed.py. NumPy and SciPy each load their own OpenBLAS, and
    # this is the one maintained way to reach both. Pure Python, BSD-3, no
    # dependencies of its own.
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-qt>=4.5", "matplotlib>=3.8", "pandas>=2.1", "ruff>=0.16"]
# The GUI is an optional extra: `pip install gratinglab` must never require
# a toolkit.
#
# PySide6-Essentials rather than the PySide6 meta-package: the Addons
# (WebEngine, Multimedia, 3D) are hundreds of megabytes this window never
# touches. Essentials still carries QtSvg, which matplotlib's Qt shim imports
# unconditionally.
#
# PySide6 (LGPLv3) rather than PyQt6 (GPL): this package is BSD-3, and an
# optional dynamically-linked dependency keeps it that way.
#
# PySide6 6.12.0 on Python 3.11 aborts the interpreter at exit (Fatal Python
# error: bool_dealloc) after heavy GUI use: it releases a reference to True or
# False that it does not own, which on 3.11 eventually frees the object during
# finalization. On 3.12 and later True and False are immortal and the bug is
# harmless. Measured in CI on 2026-10-22: 6.9.3, 6.10.3 and 6.11.2 passed twice
# each and 6.12.0 crashed twice. Only that release is excluded, and only on 3.11,
# so a fixed 6.12.x is taken as soon as it exists.
gui = [
    "matplotlib>=3.8",
    "PySide6-Essentials>=6.7,!=6.12.0; python_version < '3.12'",
    "PySide6-Essentials>=6.7; python_version >= '3.12'",
    "endstation[qt]>=0.2.2",
]
# Groove metrology: reading AFM scans and averaging them into a boundary
# profile. An extra for the same reason the GUI is one -- `pip install
# gratinglab` must stay numpy/scipy/pydantic, so a solver-only user never
# installs a plotting stack. The delta is small in practice: matplotlib is
# already in `gui`, so anyone running the window has it either way.
metrology = ["matplotlib>=3.9"]
# refractiveindex.info's tables are YAML, and the core must stay numpy, scipy
# and pydantic. PyYAML is imported only when one of those files is read.
refractiveindex = ["pyyaml>=6"]
# Mutation testing, run on demand rather than in CI -- a full sweep is orders
# of magnitude slower than the suite. Deliberately *not* in `dev`: nothing in
# CI needs it, and pinning below mutmut 3.3 keeps it installable without a Rust
# toolchain. mutmut >= 3.3 requires libcst, which ships no macOS x86_64 wheel
# and must then be compiled; 3.2.3 uses parso and is pure Python. mutmut's own
# README names this case ("known for at least the x86_64-darwin architecture").
mut = ["mutmut>=3.2,<3.3"]

[project.scripts]
# The front door, and what the application bundle launches: a chooser that
# asks which window you want. Both halves are this one package, but the
# desktop layer used to ship them as two scripts and two icons, one of them
# still named after the repository the metrology was merged from, which made
# the AFM half look like a different project. The two direct scripts below are
# unchanged, for a shortcut or a habit.
gratinglab-app = "gratinglab.gui.launcher:main"
gratinglab-gui = "gratinglab.gui.app:main"
gratinglab-metrology-gui = "gratinglab.metrology.gui:main"
# The metrology CLI, carried over unchanged. It still takes no arguments and
# dispatches on `config.ANALYSIS_MODE`; reconciling that with the rest of the
# project is real work and deliberately not part of this merge.
gratinglab-metrology = "gratinglab.metrology.cli:main"

[project.urls]
Homepage = "https://github.com/jamccoy/gratinglab"
Changelog = "https://github.com/jamccoy/gratinglab/blob/master/CHANGELOG.md"

# Solver backends register here. A backend may live in its own distribution.
[project.entry-points."gratinglab.solvers"]

[tool.setuptools.dynamic]
version = { attr = "gratinglab.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Optical constant TABLES do not ship: whether CXRO's may be redistributed is
# not settled, so the wheel and sdist carry none and `available()` is empty on
# install. That is the one place a checkout and an install differ on purpose,
# and both halves are checked: the suite uses `data/Au.txt` from the checkout,
# and release.yml asserts the wheel holds no table and that an install refuses
# `lookup("Au")` with the message that says what to do instead. A missing table
# raises rather than degrading, so the difference cannot pass for a result.
# SOURCES.md ships, because it is how a user finds out where to get one.
[tool.setuptools.package-data]
"gratinglab.materials" = ["data/SOURCES.md"]
# The metrology wiki ships too, for the same reason: pages that exist in a
# checkout and vanish on install are worse than no pages. This is also the
# model `docs/theory/` should adopt -- see docs/roadmap.md.
"gratinglab.metrology.wiki" = ["*.md"]

[tool.setuptools.exclude-package-data]
"gratinglab.materials" = ["data/*.txt"]

# Linting arrived with the metrology package and was briefly lost with it: the
# configuration lived in that project's pyproject.toml, which the merge
# discarded along with its packaging. Restored here, and now covering the whole
# project rather than the half that used to have it.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Ruff's own zero-config default before 0.x expanded it. Pyflakes (F) and the
# handful of pycodestyle error codes that are real bugs rather than style
# opinions -- undefined names, syntax errors, bare except -- not the ~900-rule
# everything selection ruff now applies with no config at all.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Relative to rootdir, so a run driven from a copied tree imports *that*
# tree's package. Without it, mutation testing silently imports the real
# source and reports every mutant as surviving -- a useless green run rather
# than a loud failure. A no-op for a plain `pytest` here, where it is the same
# path the editable install already provides.
pythonpath = ["src"]
filterwarnings = [
    "error",
    # PySide6 6.12 deprecated Qt.AA_UseHighDpiPixmaps, and matplotlib 3.11's Qt
    # backend still reads it whenever it draws a toolbar icon. Not ours to fix,
    # and scoped to that one module, so our own code still fails on it. The dots
    # stand in for the colons in "Qt::", which would split the filter.
    # Drop this once a matplotlib release stops reading the attribute.
    "ignore:Enum value .Qt..ApplicationAttribute.AA_UseHighDpiPixmaps. is marked as deprecated:DeprecationWarning:matplotlib.backends.backend_qt",
    # CI runs with PYTHONWARNDEFAULTENCODING=1, so any text open() here that
    # leaves the encoding to the platform fails on every OS, not only on
    # Windows with a non-ASCII file. These four are other projects' calls.
    # numpy's savetxt touches its output with a bare open() whatever encoding
    # it is given. threadpoolctl reads /proc/self/maps with a bare open(), so
    # on Linux only, every rigorous solve (which caps BLAS through it) failed
    # here: master's CI run 40624677314, both ubuntu jobs. Inert without the
    # flag.
    "ignore::EncodingWarning:matplotlib.font_manager",
    "ignore::EncodingWarning:numpy.lib._npyio_impl",
    "ignore::EncodingWarning:numpy.lib._datasource",
    "ignore::EncodingWarning:threadpoolctl",
]
# pytest-qt would otherwise probe every binding it knows. Verified clean under
# `python -W error -c "import PySide6.QtWidgets"`, so `filterwarnings = error`
# above needs no exemption at import; if a future PySide6 starts warning there,
# add a narrow ignore naming the exact message -- never a bare DeprecationWarning.
qt_api = "pyside6"

[tool.mutmut]
# The whole package, so the copy under `mutants/` is a working package -- this
# list controls what is *copied* as well as what is mutated, and omitting
# __init__.py leaves an incomplete tree that silently falls through to the real
# source, at which case every mutant "survives" and the run means nothing.
paths_to_mutate = ["src/gratinglab/"]

# Excluded rather than uncopied, so the package stays importable.
#
# `gui/` computes nothing: a surviving mutant in a widget means a misplaced
# button, not a wrong number, which is the whole reason that layer was arranged
# to be thin. `io/` is pinned by round-trip and corpus-parsing tests rather than
# by anything a mutation operator reaches usefully.
do_not_mutate = [
    "*/gui/*",
    "*/io/*",
    # Metrology arrived with its own suite and has never been mutated. Left
    # out for now so the merge is not also a coverage change; revisit once
    # the seam in `boundary/` is settled.
    "*/metrology/*",
    "*/__init__.py",
    # Pydantic models. mutmut's trampoline adds an un-annotated class
    # attribute holding the mutant table, and `BaseModel.__init_subclass__`
    # rejects any un-annotated attribute outright -- the module fails to
    # import, so nothing can be tested rather than something being tested
    # wrongly. A tool limitation, not a coverage judgement -- their validators
    # are covered by tests/test_illumination.py and tests/test_profiles.py.
    "*/illumination.py",
    "*/problem.py",
    "*/profiles.py",
]

# corpus.toml, which the reference tests read.
also_copy = ["benchmarks/"]
